# Constrói a imagem com o pacote de dados embutido e publica no Cloud Run: a instância parte em
# segundos, sem baixar ~590 MB na partida (no Cloud Run o disco é a própria RAM). Veja
# docs/deploy.md, seção 3. O mesmo comando serve à mão e à Action "Publicar":
#
#   gcloud builds submit --config deploy/cloudbuild.yaml
#
# Cada build roda numa máquina nova, sem cache do Docker: o pacote embutido é sempre o publicado
# na Release "dados" no momento do build.
substitutions:
  _REGION: southamerica-east1
  _SERVICE: observatorio
  _BUNDLE_URL: https://github.com/rafaelgfig/observatorio/releases/download/dados/observatorio-dados.tar
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/observatorio/app
options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY
steps:
  - id: imagem
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=BUNDLE_URL=${_BUNDLE_URL}
      - --tag=${_IMAGE}:${BUILD_ID}
      - --tag=${_IMAGE}:latest
      - .
  - id: enviar
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_IMAGE}"]
  # Sem --allow-unauthenticated: o acesso público é dado uma vez (docs/deploy.md) e se mantém.
  # --max-instances=1 é o teto de gasto; --min-instances=0 desliga sem visitas.
  - id: publicar
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --region=${_REGION}
      - --image=${_IMAGE}:${BUILD_ID}
      - --execution-environment=gen2
      - --cpu=1
      - --memory=2Gi
      - --min-instances=0
      - --max-instances=1
      - --cpu-boost
      - --quiet
