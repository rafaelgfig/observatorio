[project]
name = "observatorio"
version = "0.1.0"
description = "Explorador web de dados abertos: interrupções de energia (ANEEL) e transações imobiliárias (ITBI São Paulo)."
readme = "README.md"
authors = [
    { name = "Rafael Goncalves Figueira" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "fastexcel>=0.21.0",
    "httpx>=0.28.1",
    "polars>=2.1.0",
    "pyarrow>=26.0.0",
    "pydantic-settings>=2.16.2",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
observatorio = "observatorio.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "PTH",      # pathlib
    "RUF",      # ruff-specific
    "N",        # pep8-naming
    "S",        # bandit (segurança)
    "PL",       # pylint
    "TID",      # tidy imports
    "PT",       # pytest style
    "DTZ",      # datetimes com timezone
]
ignore = [
    "PLR0913",  # muitos argumentos: endpoints de filtro têm muitos parâmetros por natureza
    "PLR2004",  # números mágicos em comparações
    "S608",     # SQL montado com placeholders controlados (ver db.py)
    "RUF001", "RUF002", "RUF003",  # textos em português com acentos
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106"]
"src/observatorio/cli.py" = ["PLC0415"]  # imports tardios: CLI responde rápido

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "typer.Option", "typer.Argument"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
pretty = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fastexcel.*", "pyarrow.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "network: testes que acessam a internet (desligados por padrão; rode com -m network)",
]
filterwarnings = [
    "error::DeprecationWarning:observatorio.*",
    "ignore:Using .httpx. with .starlette.testclient.:DeprecationWarning",
]

[tool.coverage.run]
source = ["observatorio"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
