<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Observatório · Apagões e ITBI</title>
    <meta
      name="description"
      content="Explore interrupções de energia (ANEEL) e transações imobiliárias (ITBI São Paulo) em mapa."
    />
    <!-- endereço principal (o run.app serve a mesma página) e prévia em LinkedIn, WhatsApp etc.;
         as URLs absolutas são as de SITE_URL em .github/workflows/publicar.yml -->
    <link rel="canonical" href="https://observatorio-br.web.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Observatório" />
    <meta property="og:title" content="Observatório · Apagões e ITBI" />
    <meta
      property="og:description"
      content="Apagões de energia no Brasil (ANEEL) e transações imobiliárias de São Paulo (ITBI) em mapa, a partir de dados abertos."
    />
    <meta property="og:url" content="https://observatorio-br.web.app/" />
    <meta property="og:image" content="https://observatorio-br.web.app/static/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Mapas do Observatório: DEC de apagões por município no Brasil e R$/m² do ITBI por distrito de São Paulo"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <script>
      // Aplica o tema salvo antes do primeiro paint (padrão: escuro).
      try {
        if (localStorage.getItem("observatorio:theme") === "light") {
          document.documentElement.dataset.theme = "light";
        }
      } catch (_) {}
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.16.0/dist/maplibre-gl.css"
      integrity="sha384-S+OnE5M4U3Qc2nR0RgljGrVs06xqfRg8L7uFk/pOF5+sRuSDG4oKkqKZmFrx7w09"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/static/css/app.css" />
    <link rel="stylesheet" href="/static/css/apagoes.css" />
    <link rel="stylesheet" href="/static/css/itbi.css" />
    <script type="importmap">
      {
        "imports": {
          "maplibre-gl": "https://cdn.jsdelivr.net/npm/maplibre-gl@6.16.0/dist/maplibre-gl.mjs",
          "terra-draw": "https://cdn.jsdelivr.net/npm/terra-draw@1.39.0/dist/terra-draw.modern.js",
          "terra-draw-maplibre-gl-adapter": "https://cdn.jsdelivr.net/npm/terra-draw-maplibre-gl-adapter@1.5.0/dist/terra-draw-maplibre-gl-adapter.modern.js"
        },
        "integrity": {
          "https://cdn.jsdelivr.net/npm/maplibre-gl@6.16.0/dist/maplibre-gl.mjs": "sha384-uLwQnFL74rrONqIWx/ubL4wcAtA2h08tbMDZd9U4KbQ7GhaA7S1XKepHU89UkU7C",
          "https://cdn.jsdelivr.net/npm/terra-draw@1.39.0/dist/terra-draw.modern.js": "sha384-SL1J6zQwHE4P83f5VPhNxwchHQFEtkyWCBdn4HtTlNc+jO2wRFfPHfQUOfs+oJAE",
          "https://cdn.jsdelivr.net/npm/terra-draw-maplibre-gl-adapter@1.5.0/dist/terra-draw-maplibre-gl-adapter.modern.js": "sha384-vDI8xQANXUfuEoYvmDR2FdOF10Rpp9j0O0ohK53VKR2Ru8fYFIK21dl/6ga/c4rs"
        }
      }
    </script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#/apagoes" aria-label="Observatório — início">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M13 2 4 14h7l-1 8 9-12h-7z" />
        </svg>
        <span class="brand-text">Observatório</span>
      </a>
      <nav class="tabs" aria-label="Seções">
        <a class="tab" href="#/apagoes" data-route="apagoes">Apagões</a>
        <a class="tab" href="#/itbi" data-route="itbi">ITBI · São Paulo</a>
      </nav>
      <div class="topbar-actions">
        <span class="freshness" id="freshness"></span>
        <button class="btn btn-ghost btn-icon" id="theme-toggle" type="button"></button>
      </div>
    </header>

    <main class="layout">
      <aside class="panel" aria-label="Painel">
        <div class="panel-body" id="panel"></div>
        <footer class="credits">
          <p>
            Feito por Rafael Figueira ·
            <a href="https://www.linkedin.com/in/rafaelgfig/" target="_blank" rel="noopener">LinkedIn</a>
            ·
            <a href="https://github.com/rafaelgfig/observatorio" target="_blank" rel="noopener">código no GitHub</a>
          </p>
          <p>
            Código aberto sob a
            <a href="https://github.com/rafaelgfig/observatorio/blob/main/LICENSE" target="_blank" rel="noopener">licença MIT</a>.
            Dados abertos da ANEEL, da Prefeitura de São Paulo e do IBGE; não é publicação oficial.
          </p>
        </footer>
      </aside>
      <section class="map-wrap" id="map-wrap" aria-label="Mapa">
        <div id="map"></div>
      </section>
    </main>

    <script type="module" src="/static/js/main.js"></script>
  </body>
</html>
