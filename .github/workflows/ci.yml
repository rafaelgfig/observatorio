name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Dependências
        run: uv sync --locked

      # A extensão spatial do DuckDB é baixada de extensions.duckdb.org no 1º uso; com o cache
      # (chave = versão do DuckDB), os testes não dependem desse servidor a cada execução.
      - name: Versão do DuckDB
        id: duckdb
        run: echo "version=$(uv run python -c 'import duckdb; print(duckdb.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Cache das extensões do DuckDB
        uses: actions/cache@v4
        with:
          path: ~/.duckdb/extensions
          key: duckdb-extensions-${{ runner.os }}-${{ steps.duckdb.outputs.version }}

      - name: Extensão spatial do DuckDB
        run: uv run python -c "import duckdb; duckdb.sql('INSTALL spatial')"

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tipos
        run: uv run mypy

      - name: Testes
        run: uv run pytest --cov --cov-report=term-missing

      - name: Sintaxe do frontend
        run: |
          for f in $(find src/observatorio/web/js -name '*.js'); do
            node --input-type=module --check < "$f"
          done
